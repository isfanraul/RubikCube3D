<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Rubik Cube 3D</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="game-shell">
    <section id="canvas" class="game-stage" aria-label="3D Rubik Cube game area">
      <div class="hud"><strong id="score">Score: 0</strong><span id="game-status" role="status">Playing</span></div>
      <div id="game-over" class="game-over" hidden>
        <strong>Game over</strong>
        <button id="restart" type="button">Play again</button>
      </div>
    </section>
    <section class="controls" aria-label="Game controls">
      <div class="direction-pad" aria-label="Movement controls">
        <button id="left" type="button" aria-label="Move left">&#8592;</button>
        <button id="right" type="button" aria-label="Move right">&#8594;</button>
        <button id="top" type="button" aria-label="Move up">&#8593;</button>
        <button id="bottom" type="button" aria-label="Move down">&#8595;</button>
      </div>
      <div class="action-panel">
        <div class="action-row">
          <button id="pause" type="button">Pause</button>
          <button id="cast" type="button">Projection</button>
          <button id="acce" type="button">Accelerate</button>
        </div>
        <div class="action-row rotations">
          <button id="across" type="button">Rotate A</button>
          <button id="row" type="button">Rotate B</button>
          <button id="vertical" type="button">Rotate C</button>
        </div>
        <p class="help">WASD moves. Space accelerates. 8 pauses. 7 toggles projection. 1, 2, 3 rotate. Drag the stage to orbit the camera.</p>
      </div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
